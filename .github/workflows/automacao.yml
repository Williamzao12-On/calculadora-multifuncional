name: Automação da Calculadora

on:
push:
branches:
- main

pull_request:
branches:
- main

jobs:
verificar-projeto:

runs-on: ubuntu-latest

steps:

- name: Baixar o código do projeto
uses: actions/checkout@v4

- name: Verificar arquivos principais
run: |
echo &quot;Verificando estrutura da Calculadora Multifuncional...&quot;

test -f index.html
test -f style.css
test -f script.js

echo &quot;Todos os arquivos principais foram encontrados!&quot;

- name: Finalizar automação
run: |
echo &quot;====================================&quot;
echo &quot;Automação executada com sucesso!&quot;
echo &quot;Calculadora Multifuncional&quot;
echo &quot;====================================&quot;
